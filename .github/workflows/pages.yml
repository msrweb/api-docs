name: Deploy API documentation

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download current OpenAPI schema
        run: |
          curl --fail --location --retry 3 \
            --output openapi.json \
            "https://www.microsoft.com/en-us/research/wp-json/microsoft-research/v2/schema"
          jq empty openapi.json

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html openapi.json .nojekyll _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
